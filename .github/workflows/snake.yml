name: Refresh profile activity

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff6a00&color_dots=#1b1b21,#4a2000,#8a3a00,#ff6a00,#ffb066

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chronicle:
    name: Reiatsu panel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the panel from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python -I tools/chronicle.py assets/chronicle-panel.svg

      - name: Render the RejBoard card with the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I tools/rejboard_version.py assets

      - name: Commit it only when the numbers moved
        run: |
          if [ -n "$(git status --porcelain assets/chronicle-panel.svg assets/bankai-rejboard.svg)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/chronicle-panel.svg assets/bankai-rejboard.svg
            git commit -m "Refresh reiatsu panel and RejBoard version"
            git push
          else
            echo "No change in the reiatsu panel."
          fi
